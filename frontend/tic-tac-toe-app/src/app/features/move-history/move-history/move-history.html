<table class="move-history">
  <caption class="panel-title">Move History</caption>
  <thead>
    <tr>
      <th scope="col">Move #</th>
      <th scope="col">Player</th>
      <th scope="col">Position</th>
    </tr>
  </thead>
  <tbody>
    @for (move of moves(); track move.moveNumber) {
      <tr>
        <td class="cell-num">{{ move.moveNumber }}</td>
        <td class="cell-player" [class.cell-player--x]="move.player === 'X'" [class.cell-player--o]="move.player === 'O'">{{ move.player }}</td>
        <td class="cell-pos">{{ formatPosition(move.cellIndex) }}</td>
      </tr>
    } @empty {
      <tr>
        <td colspan="3" class="empty">No moves yet</td>
      </tr>
    }
  </tbody>
</table>
