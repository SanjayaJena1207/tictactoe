<button
  type="button"
  class="cell"
  [class.winning]="highlighted()"
  [class.game-over]="isGameOver() && !highlighted()"
  [class.cell--x]="value() === 'X'"
  [class.cell--o]="value() === 'O'"
  [disabled]="!isClickable()"
  [attr.aria-label]="'Cell ' + (index() + 1) + (value() ? ', ' + value() : ', empty')"
  (click)="onClick()"
>@if (display(); as mark) {
  <span class="mark">{{ mark }}</span>
}</button>
