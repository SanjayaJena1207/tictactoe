@if (scoreboard(); as score) {
  <h2 class="panel-title">Scoreboard</h2>
  <dl class="scoreboard">
    <div class="row">
      <dt>X Wins</dt>
      <dd class="value value--x">{{ score.xWins }}</dd>
    </div>
    <div class="row">
      <dt>O Wins</dt>
      <dd class="value value--o">{{ score.oWins }}</dd>
    </div>
    <div class="row">
      <dt>Draws</dt>
      <dd class="value value--draw">{{ score.draws }}</dd>
    </div>
  </dl>
}
