@if (scoreboard(); as score) {
  <h2 class="panel-title">Scoreboard</h2>
  <dl class="scoreboard">
    <div class="row">
      <dt>X Wins</dt>
      <dd>{{ score.xWins }}</dd>
    </div>
    <div class="row">
      <dt>O Wins</dt>
      <dd>{{ score.oWins }}</dd>
    </div>
    <div class="row">
      <dt>Draws</dt>
      <dd>{{ score.draws }}</dd>
    </div>
  </dl>
}
